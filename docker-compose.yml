# =============================================
# Smart Money Tracker - Docker Compose
# =============================================
# Usage:
#   docker compose up -d        # Start all services
#   docker compose logs -f      # Tail logs
#   docker compose down         # Stop and remove containers
#   docker compose pull         # Pull latest images
#
# Before starting: copy .env.example → .env and fill in your tokens.

version: "3.8"

services:
  # ── PostgreSQL + TimescaleDB ───────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: smart-money-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_money}
      POSTGRES_DB: ${POSTGRES_DB:-smart_money}
    ports:
      - "127.0.0.1:5432:5432"   # local-only — not exposed to internet
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_money}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Smart Money Tracker (API + Discord bot) ────────────────────────────────
  smart-money-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-money-tracker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Database — always points to the db service inside Docker network
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-smart_money}:${POSTGRES_PASSWORD:-smart_money}@db:5432/${POSTGRES_DB:-smart_money}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: ["python", "start.py"]

  # ── Optional: Telegram Bot Variant ──────────────────────────────────────────
  # Uncomment to use Telegram instead of Discord
  # smart-money-telegram:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: smart-money-telegram
  #   restart: unless-stopped
  #   ports:
  #     - "${API_PORT:-8000}:8000"
  #   environment:
  #     - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
  #     - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
  #     - WHALE_THRESHOLD_USD=${WHALE_THRESHOLD_USD:-10000}
  #     - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-30}
  #   volumes:
  #     - tracker-data:/app/data
  #   command: ["python", "start.py", "--telegram"]

volumes:
  db-data:
    driver: local

# ── Network Configuration ────────────────────────────────────────────────────
networks:
  default:
    name: smart-money-network